name: CI
on: [push, pull_request]
jobs:
  core:
    name: Go (services/core)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: 'services/core/go.mod'
    # The Protocol Buffers Go stubs under proto/gen are gitignored and never
    # committed, so they have to be generated before any Go package that
    # imports them can build. buf is what generates them.
    #
    # github_token is not optional in practice. Without it the action resolves
    # its download URL through the GitHub API ANONYMOUSLY, against a rate limit
    # shared by every unauthenticated caller on the runner's IP, and this job
    # has already failed on "API rate limit exceeded" in under a second - before
    # a single test ran. The token makes the request authenticated, which raises
    # the limit by three orders of magnitude.
    - uses: bufbuild/buf-setup-action@v1
      with:
        version: '1.72.0'
        github_token: ${{ secrets.GITHUB_TOKEN }}
    # Driven through the Makefile rather than a bare `go test ./...`, because
    # `test` already declares its dependency on the `proto` target. Spelling the
    # sequence out in YAML instead is how this job came to run `go test` with no
    # stubs present, failing every package that imports them with
    # "module github.com/ecirlabs/matrix-proto ... does not contain package
    # github.com/ecirlabs/matrix-proto/gen/go/matrix/market/v1".
    # gofmt before vet, because an unformatted tree is the cheapest failure to
    # report and the one that most pollutes later diffs.
    - name: make fmt
      run: make fmt
    - name: make vet
      run: make vet
    - name: make test
      run: make test

  proto:
    name: Proto (buf lint)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Authenticated for the same reason as in the core job above.
    - uses: bufbuild/buf-setup-action@v1
      with:
        version: '1.72.0'
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - name: buf lint
      working-directory: proto
      run: buf lint

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Enable corepack
      run: corepack enable
    - name: Install dependencies
      working-directory: apps/web
      run: corepack yarn install --frozen-lockfile
    # `yarn lint` is the ESLint CLI now: Next 16 removed `next lint`, and
    # `next build` no longer lints. Type-checking is also its own step, because
    # the build used to run with `typescript.ignoreBuildErrors` and never
    # checked types at all.
    - name: Lint
      working-directory: apps/web
      run: corepack yarn lint
    - name: Typecheck
      working-directory: apps/web
      run: corepack yarn typecheck
    - name: Test
      working-directory: apps/web
      run: corepack yarn test
    - name: Build
      working-directory: apps/web
      run: corepack yarn build

  sdk:
    name: SDK (packages/sdk)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Enable corepack
      run: corepack enable
    - name: Install dependencies
      working-directory: packages/sdk
      run: corepack yarn install --frozen-lockfile
    # This job did not exist. The SDK had tests and nothing ran them, which is
    # why it matters now: its published signing layouts are a SECOND copy of the
    # canonical ones in packages/protocol, held byte-identical by the
    # differential test in src/layout-parity.test.ts. A guard CI never runs is
    # not a guard.
    - name: Typecheck
      working-directory: packages/sdk
      run: corepack yarn typecheck
    - name: Test
      working-directory: packages/sdk
      run: corepack yarn test
    - name: Build
      working-directory: packages/sdk
      run: corepack yarn build

  contracts:
    name: Contracts (contracts)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    # Also new. The Solidity tests cover the mint threshold and timelock that
    # replaced MatrixToken's single owner key, plus the bridge attestation
    # threshold, and nothing in CI was running any of them.
    - name: Install dependencies
      working-directory: contracts
      run: npm ci
    - name: Compile
      working-directory: contracts
      run: npx hardhat compile
    - name: Test
      working-directory: contracts
      run: npx hardhat test
