[package]
name = "matrix-console"
version = "0.1.0"
description = "Matrix Console desktop shell"
authors = ["Ecir Labs"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

# See https://tauri.app for the Tauri desktop framework.

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
