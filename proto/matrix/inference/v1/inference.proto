syntax = "proto3";

package matrix.inference.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ecirlabs/matrix-proto/gen/go/matrix/inference/v1;inference";

// InferenceJobStatus mirrors the marketplace inference-job lifecycle, tracking a
// job from submission through fulfillment and token settlement.
enum InferenceJobStatus {
    // Unset/unknown status.
    INFERENCE_JOB_STATUS_UNSPECIFIED = 0;
    // Job is submitted and provider capacity is reserved, but not yet run.
    INFERENCE_JOB_STATUS_PENDING = 1;
    // Job is actively running on the provider's backend.
    INFERENCE_JOB_STATUS_RUNNING = 2;
    // Job completed: the completion was produced and units settled buyer ->
    // provider through the consensus-backed token settlement, and that settlement
    // has committed and applied on the ledger.
    INFERENCE_JOB_STATUS_COMPLETED = 3;
    // Job failed to run or settle; reserved capacity was returned.
    INFERENCE_JOB_STATUS_FAILED = 4;
    // Job's completion was produced and its payment transfer was submitted to
    // consensus, but the settlement has not yet committed+applied. The completion
    // and billed units are already populated; the job advances to COMPLETED once
    // the settlement applies. Reported so a client never reads COMPLETED for a
    // payment still pending in the mempool.
    INFERENCE_JOB_STATUS_SETTLING = 5;
    // The backend ran and the charge is known, but the buyer has not signed for
    // it yet. This is the state the CLIENT-SIGNED path parks in: the price of an
    // inference is not knowable until the work is done, so a buyer cannot
    // pre-sign a transfer for it. The completion is WITHHELD until the payment
    // is signed; the reservation is released if it never is.
    INFERENCE_JOB_STATUS_AWAITING_PAYMENT = 6;
}

// ChatRole enumerates the standard chat message roles for chat-style inference.
enum ChatRole {
    // Unset/unknown role.
    CHAT_ROLE_UNSPECIFIED = 0;
    // A system instruction message.
    CHAT_ROLE_SYSTEM = 1;
    // A user/buyer message.
    CHAT_ROLE_USER = 2;
    // An assistant/model message.
    CHAT_ROLE_ASSISTANT = 3;
}

// ChatMessage is a single turn in a chat conversation.
message ChatMessage {
    // The speaker role for this message.
    ChatRole role = 1;
    // The message text content.
    string content = 2;
}

// TokenUsage is the token accounting a provider's backend reported for a
// completed inference, mirroring the OpenAI usage object. It answers a different
// question from InferenceJob.units: usage is how much work was done, units is
// what the buyer paid (billable units scaled by the provider's price and clamped
// to the reservation). A caller checking a bill needs both to see how one became
// the other.
message TokenUsage {
    // Tokens in the prompt/messages.
    uint32 prompt_tokens = 1;
    // Tokens in the generated completion.
    uint32 completion_tokens = 2;
    // prompt_tokens + completion_tokens.
    uint32 total_tokens = 3;
}

// InferenceJob describes an inference job submitted by a buyer against an
// inference-capable provider, and its result once fulfilled.
message InferenceJob {
    // Stable inference job identifier (equal to the underlying market job ID).
    string id = 1;
    // Account ID of the buyer who submitted the job.
    string buyer = 2;
    // Provider ID that fulfills the inference.
    string provider = 3;
    // Model identifier requested.
    string model = 4;
    // Current lifecycle status.
    InferenceJobStatus status = 5;
    // Generated completion text (empty until COMPLETED).
    string completion = 6;
    // Billed units, equal to the token amount settled buyer -> provider.
    uint64 units = 7;
    // When the job was submitted.
    google.protobuf.Timestamp created_at = 8;
    // When the job's status last changed.
    google.protobuf.Timestamp updated_at = 9;
    // Token accounting reported by the provider's backend, zero until the job
    // has been fulfilled.
    TokenUsage usage = 10;
}

// SubmitInferenceJobRequest submits an inference job to a provider. Capacity is
// reserved at submit time; the token settles on fulfillment. Provide either
// prompt or messages; messages takes precedence when both are set.
message SubmitInferenceJobRequest {
    // Buyer account ID.
    string buyer = 1;
    // Target inference-capable provider ID.
    string provider = 2;
    // Model identifier to run.
    string model = 3;
    // Single user prompt. Used when messages is empty.
    string prompt = 4;
    // Full chat transcript. Takes precedence over prompt.
    repeated ChatMessage messages = 5;
    // Optional maximum completion length in tokens. Zero means backend default.
    uint32 max_tokens = 6;
    // Optional sampling temperature. Zero means backend default.
    double temperature = 7;
    // Upfront estimate of the compute units to reserve. Zero defaults to one.
    uint64 units_estimate = 8;
}

// SubmitInferenceJobResponse returns the newly-created PENDING inference job.
message SubmitInferenceJobResponse {
    // The created job in PENDING state.
    InferenceJob job = 1;
}

// FulfillInferenceJobRequest runs and settles a pending inference job.
message FulfillInferenceJobRequest {
    // Inference job ID to fulfill.
    string id = 1;
}

// FulfillInferenceJobResponse returns the fulfilled, settled inference job.
message FulfillInferenceJobResponse {
    // The job in COMPLETED state with its completion and settled units.
    InferenceJob job = 1;
}

// PaymentRequest is the exact transfer a buyer must sign to settle a job. Every
// field is covered by the transaction signature, so signing it authorises this
// recipient and this amount and nothing else: the node cannot raise the charge
// or redirect it afterwards.
message PaymentRequest {
    // The inference job this payment settles.
    string job_id = 1;
    // The buyer's account ID, which must be the signer.
    string from = 2;
    // The provider being paid.
    string to = 3;
    // The charge in native MATRIX base units.
    uint64 amount = 4;
    // Nonce, timestamp and prev_hash complete the signable transfer. The node
    // chooses them because they carry no economic meaning for the buyer; the
    // fields a buyer cares about are `to` and `amount`.
    uint64 nonce = 5;
    int64 timestamp = 6;
    bytes prev_hash = 7;
    // What the buyer is being billed for, so a wallet can show a reason
    // alongside the number.
    TokenUsage usage = 8;
    string model = 9;
    // When an unsigned request stops being settleable and its reservation is
    // released.
    google.protobuf.Timestamp expires_at = 10;
}

// RunInferenceJobRequest runs an inference and returns the payment to sign,
// WITHOUT the completion. It is the client-signed entry point: the node needs no
// signing key for the buyer, because the buyer signs the resulting transfer
// themselves and gets the completion from SettleInferenceJob.
message RunInferenceJobRequest {
    // Buyer account ID. It must be the account that signs the payment.
    string buyer = 1;
    // Target inference-capable provider ID.
    string provider = 2;
    // Model identifier to run.
    string model = 3;
    // Single user prompt. Used when messages is empty.
    string prompt = 4;
    // Full chat transcript. Takes precedence over prompt.
    repeated ChatMessage messages = 5;
    // Optional maximum completion length in tokens. Zero means backend default.
    uint32 max_tokens = 6;
    // Optional sampling temperature. Zero means backend default.
    double temperature = 7;
    // Upfront estimate of the compute units to reserve. Zero defaults to one.
    uint64 units_estimate = 8;
}

// RunInferenceJobResponse returns the payment to sign and the job in
// AWAITING_PAYMENT. The job's completion is empty by design.
message RunInferenceJobResponse {
    // The transfer to sign.
    PaymentRequest payment = 1;
    // The job, in AWAITING_PAYMENT with usage and billed units populated and the
    // completion withheld.
    InferenceJob job = 2;
}

// SettleInferenceJobRequest submits the buyer's signed transfer for a job that is
// awaiting payment. Every signable field must match the PaymentRequest the job
// is waiting for, or the settlement is refused: a signature that verifies is not
// enough on its own, since a buyer could sign a perfectly valid transfer of one
// base unit to an account they control.
message SettleInferenceJobRequest {
    // The job being settled.
    string id = 1;
    // The buyer's ed25519 public key (32 bytes), which must derive the buyer
    // account ID the job was submitted for.
    bytes from_public_key = 2;
    // The signed transfer's fields, which must equal the payment request's.
    string to = 3;
    uint64 amount = 4;
    uint64 nonce = 5;
    int64 timestamp = 6;
    bytes prev_hash = 7;
    // The buyer's ed25519 signature over the canonical transfer bytes.
    bytes signature = 8;
}

// SettleInferenceJobResponse returns the settled job, with its completion.
message SettleInferenceJobResponse {
    // The job in COMPLETED state, carrying the completion the buyer has now paid
    // for.
    InferenceJob job = 1;
}

// StreamInferenceJobRequest submits an inference job and streams its completion
// as it is produced. It is the hosted path: the node signs the payment with a
// key it holds for the buyer once the model has finished.
//
// Streaming is deliberately unavailable on the CLIENT-SIGNED path. There the
// completion is withheld until the buyer signs the invoice, and withholding is
// the only enforcement because the provider has already worked; streaming the
// answer out and then asking to be paid gives the whole thing away first.
message StreamInferenceJobRequest {
    // Buyer account ID. The node must hold this account's signing key.
    string buyer = 1;
    // Target inference-capable provider ID.
    string provider = 2;
    // Model identifier to run.
    string model = 3;
    // Single user prompt. Used when messages is empty.
    string prompt = 4;
    // Full chat transcript. Takes precedence over prompt.
    repeated ChatMessage messages = 5;
    // Optional maximum completion length in tokens. Zero means backend default.
    uint32 max_tokens = 6;
    // Optional sampling temperature. Zero means backend default.
    double temperature = 7;
    // Upfront estimate of the compute units to reserve. Zero defaults to one.
    uint64 units_estimate = 8;
}

// StreamInferenceJobResponse is one message of a streamed completion. Every
// message carries a delta; the last one also carries the finished job.
message StreamInferenceJobResponse {
    // The next piece of the completion. Concatenating every chunk's delta gives
    // the whole completion, byte for byte.
    string delta = 1;
    // The job ID, on every chunk so a client can correlate without waiting for
    // the end.
    string job_id = 2;
    // Set on the final chunk only: the settled job, with its usage, billed units
    // and status. A client must not treat a stream as paid for until it has
    // this.
    InferenceJob job = 3;
    // True on the final chunk when the provider's backend could not stream and
    // the whole completion arrived as a single delta. Reported so a client can
    // stop pretending there is a typing effect rather than having to guess which
    // backends stream.
    bool streamed_one_shot = 4;
}

// GetInferenceJobRequest looks up a single inference job by ID.
message GetInferenceJobRequest {
    // Inference job ID to fetch.
    string id = 1;
}

// GetInferenceJobResponse returns the requested inference job and its result.
message GetInferenceJobResponse {
    // The requested inference job.
    InferenceJob job = 1;
}

// InferenceService is the external gRPC surface for LLM inference in the Matrix
// OS compute marketplace. Buyers submit inference jobs to inference-capable
// providers (which contribute either a local model runner or a proxied
// provider-API backend); providers fulfill them; and the computed units settle
// buyer -> provider in the token through the consensus-backed settlement path.
service InferenceService {
    // SubmitInferenceJob submits an inference job to a provider, reserving
    // capacity. Input: buyer, provider, model, prompt or messages, and optional
    // params. Output: the created PENDING job. Side effects: reserves provider
    // capacity and performs the buyer affordability check. No token moves yet.
    rpc SubmitInferenceJob(SubmitInferenceJobRequest) returns (SubmitInferenceJobResponse) {}

    // FulfillInferenceJob runs a pending job on the provider's backend and
    // settles it. Input: job ID. Output: the COMPLETED job with completion and
    // settled units. Side effects: runs inference, settles units buyer ->
    // provider through the consensus token settlement, and releases reserved
    // capacity.
    rpc FulfillInferenceJob(FulfillInferenceJobRequest) returns (FulfillInferenceJobResponse) {}

    // GetInferenceJob fetches a single inference job and its result by ID. Input:
    // job ID. Output: the job. No side effects.
    rpc GetInferenceJob(GetInferenceJobRequest) returns (GetInferenceJobResponse) {}

    // RunInferenceJob is the CLIENT-SIGNED path. It reserves capacity, runs the
    // inference, and returns the exact transfer to sign - not the completion.
    // Input: buyer, provider, model, prompt or messages. Output: a
    // PaymentRequest and the job in AWAITING_PAYMENT. Side effects: reserves
    // capacity, performs the affordability check, and runs the model. No token
    // moves, and the node needs no signing key for the buyer.
    //
    // Use this instead of SubmitInferenceJob + FulfillInferenceJob wherever the
    // node should not hold the buyer's key: a public endpoint, where signing on
    // a caller's behalf makes the operator a custodian, and a dApp, where it
    // would make wallet login decorative.
    rpc RunInferenceJob(RunInferenceJobRequest) returns (RunInferenceJobResponse) {}

    // StreamInferenceJob submits a job and streams its completion as it is
    // produced, then settles it. Input: buyer, provider, model, prompt or
    // messages. Output: a stream of InferenceChunk, the last of which carries
    // the settled job. Side effects: reserves capacity, runs the model, and
    // settles the charge through consensus with a key the node holds for the
    // buyer.
    //
    // A client that hangs up mid-stream aborts the run, so the provider stops
    // generating tokens nobody will read; the job is then failed and its
    // reservation released rather than billed.
    rpc StreamInferenceJob(StreamInferenceJobRequest) returns (stream StreamInferenceJobResponse) {}

    // SettleInferenceJob submits the buyer's signed transfer for a job awaiting
    // payment and returns the completion. Input: the job ID and the signed
    // transfer. Output: the COMPLETED job with its completion. Side effects:
    // submits the transfer to consensus and waits for it to commit AND apply,
    // then releases the reservation. A transfer that does not match the payment
    // request exactly is refused.
    rpc SettleInferenceJob(SettleInferenceJobRequest) returns (SettleInferenceJobResponse) {}
}
