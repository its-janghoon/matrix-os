syntax = "proto3";

package matrix.market.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ecirlabs/matrix-proto/gen/go/matrix/market/v1;market";

// JobStatus mirrors the marketplace job lifecycle. Values track a paid compute
// job from submission through settlement or teardown.
enum JobStatus {
    // Unset/unknown status.
    JOB_STATUS_UNSPECIFIED = 0;
    // Job is submitted and capacity is reserved, but not yet settled.
    JOB_STATUS_PENDING = 1;
    // Job is actively executing on the provider.
    JOB_STATUS_RUNNING = 2;
    // Job settled successfully and credits transferred buyer -> provider.
    JOB_STATUS_COMPLETED = 3;
    // Job failed to execute; no credits transferred.
    JOB_STATUS_FAILED = 4;
    // Job was cancelled and reserved capacity returned to the provider.
    JOB_STATUS_CANCELLED = 5;
}

// ProviderOrigin distinguishes providers registered on this local node from
// providers discovered over the P2P gossip network, so buyers can tell local
// capacity apart from remote capacity.
enum ProviderOrigin {
    // Unset/unknown origin.
    PROVIDER_ORIGIN_UNSPECIFIED = 0;
    // Provider is registered on the local node's order book.
    PROVIDER_ORIGIN_LOCAL = 1;
    // Provider was discovered from a remote P2P announcement.
    PROVIDER_ORIGIN_REMOTE = 2;
}

// Provider describes an idle-machine compute provider and its advertised
// capacity, pricing, and origin (local order book vs. remote P2P discovery).
message Provider {
    // Stable provider identifier.
    string id = 1;
    // Total advertised capacity in compute units.
    uint64 capacity = 2;
    // Price per compute unit, in credits.
    uint64 price_per_unit = 3;
    // Currently-available (unreserved) capacity in compute units.
    uint64 available = 4;
    // Whether this provider is local or remote.
    ProviderOrigin origin = 5;
    // For remote providers, the libp2p peer ID that announced the provider.
    // Empty for local providers.
    string peer_id = 6;
    // Model identifiers this provider serves, normalized to lowercase and
    // sorted. This is what a request naming a model is routed on; a
    // compute-only provider advertises none and is never selected by model.
    repeated string models = 7;
    // Provider's manually observed upstream cost basis in native MATRIX base
    // units. This is metadata only; price_per_unit is the final customer quote
    // and must already include provider margin and protocol-fee gross-up.
    uint64 cost_per_unit = 8;
    // Provider markup in basis points recorded with cost_per_unit.
    uint32 markup_basis_points = 9;
    // Stable identity of this quote observation.
    string quote_id = 10;
    // Monotonically increasing quote revision for this provider.
    uint64 quote_version = 11;
    // When the provider observed the MATRIX-denominated quote inputs.
    google.protobuf.Timestamp observed_at = 12;
    // Exclusive expiry after which this quote is ineligible for new jobs.
    google.protobuf.Timestamp valid_until = 13;

    // The remaining fields describe a REMOTE provider as the directory sees it.
    // They are empty for a local one, whose address and history the caller
    // already has.

    // Account id of the node that signed this announcement. It is the
    // counterparty a buyer connecting to `endpoint` is choosing, and it is
    // distinct from `id`: `id` is the payout account the node settles into and
    // may be a wallet address, while this is the node that holds the model and
    // answers the request.
    string node_id = 14;
    // Base URL a buyer's client connects to, serving both the OpenAI-compatible
    // route and the Connect API. Empty when the announcing node published no
    // address, which is the honest state of one selling compute units rather
    // than inference: there is nothing for an HTTP client to reach.
    //
    // Signed by the announcer, so a relaying peer cannot redirect somebody
    // else's traffic to a host of its choosing.
    string endpoint = 15;
    // When THIS node first heard an announcement from that announcer, and how
    // many it has accepted since.
    //
    // Both are OBSERVED, never announced. A seller's own uptime figure is a
    // claim that costs nothing to inflate, so the protocol carries none; these
    // are what the reader watched happen. They are one observer's view - gossip
    // drops messages for reasons that are sometimes the reader's own fault - so
    // they are evidence of a node's presence rather than a guarantee of service,
    // and should be shown to a buyer as exactly that.
    google.protobuf.Timestamp first_seen = 16;
    uint64 announcements_heard = 17;

    // What this provider's payout account has actually been PAID, read from the
    // answering node's own copy of the committed chain. The seller has no say in
    // these numbers: a payment that did not happen leaves no block to find.
    //
    // What they do NOT prove, because the figure will be read as more than it
    // is: an inference settlement is an ordinary transfer and the chain does not
    // mark it as one, so this counts every payment the account received, not
    // only what it earned. A seller can pay itself from an account it controls.
    // That costs the protocol fee on each transfer plus the capital to move it,
    // which is why `settled_payers` is the number worth weighing - inflating
    // `settled_received` is one self-transfer, inflating the payer count means
    // funding a fresh account for every one.
    //
    // Present them as history, never as a rating.
    uint64 settled_received = 18;
    uint64 settled_payments = 19;
    uint64 settled_payers = 20;
    // Heights bracketing the activity, so a seller working for months reads
    // differently from one paid twice yesterday.
    uint64 settled_first_height = 21;
    uint64 settled_last_height = 22;
    // The first height the answering node's tally covers. A node that upgraded
    // into this counts from the upgrade, not from genesis, and a display that
    // does not say so is claiming more than it knows.
    uint64 settled_indexed_from = 23;
}

// Job describes a paid compute job submitted by a buyer against a provider.
message Job {
    // Stable job identifier.
    string id = 1;
    // Account ID of the buyer who submitted the job.
    string buyer = 2;
    // Provider ID the job runs against.
    string provider = 3;
    // Number of compute units requested.
    uint64 units = 4;
    // Total price in credits (units * provider price_per_unit).
    uint64 price = 5;
    // Current lifecycle status.
    JobStatus status = 6;
    // When the job was submitted.
    google.protobuf.Timestamp created_at = 7;
    // When the job's status last changed.
    google.protobuf.Timestamp updated_at = 8;
    // Final per-unit price snapshotted when capacity was reserved.
    uint64 price_per_unit = 9;
    // Quote identity snapshotted when capacity was reserved.
    string quote_id = 10;
    // Quote revision snapshotted when capacity was reserved.
    uint64 quote_version = 11;
    // Provider quote observation time snapshotted at reservation.
    google.protobuf.Timestamp quote_observed_at = 12;
    // Provider quote expiry snapshotted at reservation.
    google.protobuf.Timestamp quote_valid_until = 13;
}

// Transaction is a single value transfer that consensus committed, read back
// from the globally-agreed committed block chain. Native MATRIX transfers now
// settle through consensus (a signed transfer is ordered and applied by a
// quorum), so the transaction history is the ordered sequence of committed
// transfers - the same on every node - rather than a per-node hash chain.
message Transaction {
    // Retired fields from the pre-consensus per-node token.Chain representation.
    // Field numbers 1 and 6 were deliberately re-purposed in lockstep (height ->
    // index, the hash bytes -> block_height) when value transfers moved to
    // consensus; every in-tree consumer was migrated together. Field 8 (the old
    // timestamp slot, now field 7) is retired outright. The old names are
    // reserved so they can never be accidentally re-added at a different number,
    // which would let a stale client silently mis-map a field.
    reserved 8;
    reserved "height", "hash", "prev_hash";
    // Stable zero-based position of this transfer in the consensus transfer
    // history (block order, then transaction order within the block). It only
    // grows and is identical on every node. Used as the index for
    // GetTransaction and as the paging cursor for ListTransactions.
    uint64 index = 1;
    // Sender account ID (hex-encoded ed25519 public key).
    string from = 2;
    // Recipient account ID.
    string to = 3;
    // Gross amount transferred, in credits, before any protocol fee.
    uint64 amount = 4;
    // Per-sender transfer nonce (a uniquifier; consensus provides replay
    // protection through its committed-transaction dedup set).
    uint64 nonce = 5;
    // Committed block height the transfer landed in.
    uint64 block_height = 6;
    // Advisory wall-clock time the transfer carried.
    google.protobuf.Timestamp timestamp = 7;
}

// RegisterProviderRequest advertises local compute capacity on the order book.
message RegisterProviderRequest {
    // Desired provider ID. Must be non-empty and unique.
    string id = 1;
    // Total capacity in compute units. Must be > 0.
    uint64 capacity = 2;
    // Price per compute unit in credits. Must be > 0.
    uint64 price_per_unit = 3;
    // Optional model identifiers this provider serves. Normalized to lowercase,
    // de-duplicated and sorted on registration. Omit for a compute-only
    // provider; a provider that serves no model is never selected by model.
    repeated string models = 4;
    // Optional manually observed upstream cost basis in native MATRIX base
    // units. This is metadata only: price_per_unit remains required and must
    // already include provider margin plus protocol-fee gross-up. The API never
    // derives a final price from this field; config-backed registration is the
    // safe automatic gross-up path.
    optional uint64 cost_per_unit = 5;
    // Optional provider markup in basis points recorded as quote metadata.
    optional uint32 markup_basis_points = 6;
    // Optional quote identity. The market generates one when omitted.
    string quote_id = 7;
    // Optional quote revision. The market initializes it when omitted.
    uint64 quote_version = 8;
    // Optional observation time. The market uses the current time when omitted.
    google.protobuf.Timestamp observed_at = 9;
    // Optional exclusive expiry. The market applies its default TTL when omitted.
    google.protobuf.Timestamp valid_until = 10;
}

// RegisterProviderResponse returns the registered provider record.
message RegisterProviderResponse {
    // The registered provider, with available capacity initialized to capacity.
    Provider provider = 1;
}

// UpdateProviderQuoteRequest replaces only an existing provider's economic
// quote. Capacity, current availability, and advertised models are preserved.
message UpdateProviderQuoteRequest {
    // Existing provider ID whose quote is being refreshed.
    string id = 1;
    // Required final customer price in native MATRIX base units. It must already
    // include provider margin and protocol-fee gross-up.
    uint64 price_per_unit = 2;
    // Optional manually observed MATRIX-denominated cost metadata. The server
    // does not derive price_per_unit from it.
    optional uint64 cost_per_unit = 3;
    // Optional provider markup metadata in basis points.
    optional uint32 markup_basis_points = 4;
    // Optional quote identity. The market generates one when omitted.
    string quote_id = 5;
    // Optional quote revision. The market advances it when omitted or stale.
    uint64 quote_version = 6;
    // Optional observation time. The market uses the current time when omitted.
    google.protobuf.Timestamp observed_at = 7;
    // Optional exclusive expiry. The market applies its default TTL when omitted.
    google.protobuf.Timestamp valid_until = 8;
}

// UpdateProviderQuoteResponse returns the refreshed provider while preserving
// its capacity reservation and model advertisement.
message UpdateProviderQuoteResponse {
    // The provider after its quote was refreshed.
    Provider provider = 1;
}

// ListProvidersRequest enumerates providers.
message ListProvidersRequest {
    // When true, include remote providers discovered over P2P gossip in
    // addition to the local order book. When false, only local providers are
    // returned.
    bool include_remote = 1;
    // When non-empty, return only providers that advertise this model and still
    // have capacity to reserve. Matched case-insensitively.
    string model = 2;
}

// ListProvidersResponse returns providers, each flagged by origin.
message ListProvidersResponse {
    // Providers ordered by ID, local entries followed by remote entries.
    repeated Provider providers = 1;
}

// SubmitJobRequest reserves capacity for a paid compute job. No credits move at
// submit time; the buyer is charged only on CompleteJob.
message SubmitJobRequest {
    // Buyer account ID.
    string buyer = 1;
    // Target provider ID.
    string provider = 2;
    // Number of compute units to reserve. Must be > 0.
    uint64 units = 3;
}

// SubmitJobResponse returns the newly-created pending job.
message SubmitJobResponse {
    // The created job in PENDING state.
    Job job = 1;
}

// GetJobRequest looks up a single job by ID.
message GetJobRequest {
    // Job ID to fetch.
    string id = 1;
}

// GetJobResponse returns the requested job.
message GetJobResponse {
    // The requested job.
    Job job = 1;
}

// ListJobsRequest enumerates jobs.
message ListJobsRequest {
    // Optional buyer filter. When non-empty, only jobs submitted by this buyer
    // are returned.
    string buyer = 1;
}

// ListJobsResponse returns jobs in chronological order.
message ListJobsResponse {
    // Jobs ordered by creation time, then ID.
    repeated Job jobs = 1;
}

// CompleteJobRequest settles a pending/running job, transferring its price from
// buyer to provider.
message CompleteJobRequest {
    // Job ID to complete.
    string id = 1;
}

// CompleteJobResponse returns the settled job.
message CompleteJobResponse {
    // The job in COMPLETED state.
    Job job = 1;
}

// CancelJobRequest cancels a pending/running job and returns reserved capacity.
message CancelJobRequest {
    // Job ID to cancel.
    string id = 1;
}

// CancelJobResponse returns the cancelled job.
message CancelJobResponse {
    // The job in CANCELLED state.
    Job job = 1;
}

// GetBalanceRequest reads a compute-credit balance.
message GetBalanceRequest {
    // Account ID to read the balance for. Unknown accounts return zero.
    string account = 1;
}

// GetBalanceResponse returns a compute-credit balance.
message GetBalanceResponse {
    // Account ID the balance belongs to.
    string account = 1;
    // Current balance in credits.
    uint64 balance = 2;
}

// GetTransactionRequest reads one committed transfer from the consensus
// transaction history by its stable index.
message GetTransactionRequest {
    // Zero-based index of the transfer in the consensus transaction history.
    uint64 index = 1;
}

// GetTransactionResponse returns a single committed transfer.
message GetTransactionResponse {
    // The transfer recorded at the requested index.
    Transaction transaction = 1;
}

// ListTransactionsRequest reads committed transfers from the consensus
// transaction history in order.
message ListTransactionsRequest {
    // start_height was the pre-consensus token.Chain height cursor; field 1 is
    // re-purposed as start_index. The old name is reserved against accidental
    // re-add at a different number.
    reserved "start_height";
    // Zero-based index to start from (inclusive).
    uint64 start_index = 1;
    // Maximum number of transfers to return. Zero means no explicit limit (the
    // server may still cap the result).
    uint64 limit = 2;
}

// ListTransactionsResponse returns committed transfers and the total count.
message ListTransactionsResponse {
    // chain_length was the pre-consensus token.Chain length; field 2 is
    // re-purposed as total. The old name is reserved against accidental re-add.
    reserved "chain_length";
    // Transfers in ascending index (commit) order.
    repeated Transaction transactions = 1;
    // Total number of committed transfers in the consensus history.
    uint64 total = 2;
}

// SubmitSignedTransferRequest carries a client-signed ed25519 transfer to be
// ordered and settled through consensus. The signature must cover the canonical
// serialization of the sender key, recipient, amount, nonce, timestamp and
// prev_hash (the same signing bytes the wallet produces).
//
// The transfer now settles through consensus rather than a per-node signed
// chain: it is submitted into the engine, a quorum orders it into a committed
// block, and every node applies it deterministically to the shared ledger, so
// two nodes agree on the resulting balances and the transfer is subject to the
// protocol fee like every other committed transfer. Consensus provides replay
// protection through its committed-transaction dedup set, so the nonce is a
// per-sender uniquifier that keeps otherwise-identical transfers distinct; it no
// longer has to equal a "next expected" value. prev_hash is no longer used for
// ledger linkage and may be left empty; it is retained only so an existing
// signature over the wallet's canonical payload still verifies.
message SubmitSignedTransferRequest {
    // Sender's raw 32-byte ed25519 public key.
    bytes from_public_key = 1;
    // Recipient account ID.
    string to = 2;
    // Amount to transfer, in credits.
    uint64 amount = 3;
    // Per-sender transfer nonce (a uniquifier; need only be distinct per
    // sender, not "next expected").
    uint64 nonce = 4;
    // Retained only so a signature over the wallet's canonical payload still
    // verifies; unused for consensus ledger linkage and may be empty.
    bytes prev_hash = 5;
    // ed25519 signature over the canonical transaction payload.
    bytes signature = 6;
    // Advisory wall-clock time in unix nanoseconds (does not affect validation).
    int64 timestamp = 7;
}

// SubmitSignedTransferResponse reports how a signed transfer settled through
// consensus. The transfer field carries the settled transfer as it appears in
// the committed history; committed/applied report the consensus outcome.
message SubmitSignedTransferResponse {
    // The settled transfer, populated with its committed index and block height
    // once it has committed.
    Transaction transaction = 1;
    // Whether the transfer was ordered into a committed block.
    bool committed = 2;
    // Whether the transfer actually moved credits when applied. A committed but
    // not-applied transfer was deterministically skipped as unaffordable at
    // apply time, so no credits moved.
    bool applied = 3;
}

// FundAccountRequest moves native MATRIX out of the genesis-allocated reward
// pool into an account. It is the sanctioned bootstrap-funding path: it never
// mints new coins, it only transfers coins that already exist in the reward
// pool, so the native supply cap is respected. Operators/users call it to seed a
// buyer account with spendable MATRIX before submitting paid compute jobs.
message FundAccountRequest {
    // Recipient account ID to credit from the reward pool. Must be non-empty and
    // must not be the reward pool account itself.
    string account = 1;
    // Amount to move from the reward pool, in native base units. Must be > 0 and
    // must not exceed the current reward-pool balance.
    uint64 amount = 2;
}

// FundAccountResponse returns the recipient account and its new balance after
// the reward-pool transfer.
message FundAccountResponse {
    // Account ID that was funded.
    string account = 1;
    // The account's balance in native base units after funding.
    uint64 balance = 2;
}

// GetBridgeReadinessRequest asks a validator to prove that its live attestor
// key is configured for the exact WrappedMatrix deployment the caller intends
// to use. The caller supplies fresh entropy so a cached response cannot be
// replayed as current readiness.
message GetBridgeReadinessRequest {
    // Exactly 32 random bytes generated by the caller.
    bytes challenge = 1;
}

// GetBridgeReadinessResponse is a challenge-bound proof of this validator's
// pre-lock deployment configuration. The signature is over a readiness-only
// domain-separated digest containing every response field; it is never the
// WrappedMatrix mint-attestation digest.
message GetBridgeReadinessResponse {
    // EVM chain id configured on this validator.
    uint64 chain_id = 1;
    // Normalized 0x-prefixed lowercase WrappedMatrix contract address.
    string contract = 2;
    // Normalized 0x-prefixed lowercase address recovered from this node's live
    // secp256k1 attestor key.
    string attestor = 3;
    // Protocol minimum native lock amount in native base units.
    uint64 min_lock_native = 4;
    // Exact 32-byte challenge supplied by the caller.
    bytes challenge = 5;
    // Ethereum-style 65-byte r||s||v signature over the readiness digest.
    bytes signature = 6;
}

// GetLockAttestationRequest asks a node to sign the mint authorization for a
// lock the chain has already committed.
message GetLockAttestationRequest {
    // Hex-encoded 32-byte lock id, as derived from the committed lock
    // transaction (nonce, sender, ethereum recipient, amount). A client that
    // derives it differently is asking about a lock that does not exist.
    string lock_id = 1;
}

// GetLockAttestationResponse carries THIS node's single signature over the
// canonical mint digest.
//
// One signature, not a threshold. Each validator holds its own attestor key, and
// gathering m of them is the client's job: ask each validator's node and feed
// the collected set to WrappedMatrix.mint, which does the counting. Gossiping
// partial signatures would be a second consensus for something the contract
// already verifies.
message GetLockAttestationResponse {
    // The Ethereum address the wrapped tokens will be minted to, 0x hex.
    string recipient = 1;
    // The wrapped amount to mint, in ERC-20 base units (18 decimals), decimal
    // string because it exceeds a uint64.
    string erc20_amount = 2;
    // Echo of the lock id this authorizes, hex.
    string lock_id = 3;
    // This node's 65-byte r||s||v signature, hex.
    string signature = 4;
    // The attestor address that signature recovers to, 0x hex. A client can
    // check it against the contract's registered set before spending gas.
    string attestor = 5;
    // The native base units locked, so a caller can verify the conversion
    // without a second round trip.
    uint64 native_amount = 6;
}

// GetBridgeReconciliationRequest asks the node for the current lock-and-mint
// bridge backing snapshot. It takes no arguments: the snapshot is a read of the
// node's own escrow accounting at the moment it is served.
message GetBridgeReconciliationRequest {}

// GetBridgeReconciliationResponse carries a lock-and-mint bridge backing
// snapshot proving native MATRIX held in escrow equals the wrapped supply the
// Ethereum contract should show. Every field is derived from the node's own
// on-ledger escrow accounting, so the report is reproducible from public data
// rather than a manual query, and it is served only after the node has verified
// the on-ledger escrow balance equals the (locked - unlocked) accounting.
message GetBridgeReconciliationResponse {
    // Cumulative native base units (9 decimals) ever locked into escrow.
    uint64 locked_native = 1;
    // Cumulative native base units ever unlocked (released on a processed burn).
    uint64 unlocked_native = 2;
    // Native base units currently held in escrow backing the wrapped supply
    // (locked_native - unlocked_native).
    uint64 outstanding_native = 3;
    // The actual bridge escrow account balance on the node's ledger. The node
    // only returns a snapshot when this equals outstanding_native; a mismatch is
    // reported as an error instead.
    uint64 escrow_balance = 4;
    // outstanding_native converted to ERC-20 base units (18 decimals) - the
    // wrapped total supply the Ethereum WrappedMatrix contract must show if it
    // is correctly backed 1:1. It is a decimal string because the value is a
    // big integer (up to 1e27) that does not fit a uint64.
    string outstanding_erc20 = 5;
    // The committed consensus block height the snapshot reflects, so the report
    // is anchored to a stated point and reproducible: any node replaying the
    // committed chain to this height derives the same escrow accounting.
    uint64 block_height = 6;
}

// MarketService is the external gRPC surface of the Matrix OS compute
// marketplace. It exposes the local order book, remote P2P providers, the
// compute-credit ledger, signed settlement, and the token chain so external
// buyers and providers can register capacity, submit and settle paid compute
// jobs, and audit settled transfers.
service MarketService {
    // RegisterProvider advertises local idle-compute capacity on the order book.
    // Input: desired ID, total capacity, and price per unit (all required, > 0).
    // Output: the registered provider with available capacity seeded to capacity.
    // Side effects: persists the provider and updates provider-count metrics.
    rpc RegisterProvider(RegisterProviderRequest) returns (RegisterProviderResponse) {}

    // UpdateProviderQuote refreshes an existing provider's final price and
    // optional manually observed quote metadata. Input: provider ID, required
    // final price, and optional cost/markup/identity/validity fields. Output: the
    // updated provider. Side effects: persists only the economic quote; capacity,
    // current availability, and models are preserved.
    rpc UpdateProviderQuote(UpdateProviderQuoteRequest) returns (UpdateProviderQuoteResponse) {}

    // ListProviders enumerates providers. Input: whether to include remote P2P
    // providers. Output: providers flagged by origin (local vs. remote). No side
    // effects; remote entries are drawn from the P2P discovery registry.
    rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {}

    // SubmitJob reserves provider capacity for a paid job. Input: buyer,
    // provider, and units (> 0). Output: the created PENDING job. Side effects:
    // decrements the provider's available capacity and persists a new job. No
    // credits move until CompleteJob.
    rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse) {}

    // GetJob fetches a single job by ID. Input: job ID. Output: the job. No side
    // effects.
    rpc GetJob(GetJobRequest) returns (GetJobResponse) {}

    // ListJobs enumerates jobs in chronological order. Input: optional buyer
    // filter. Output: matching jobs. No side effects.
    rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {}

    // CompleteJob settles a pending/running job. Input: job ID. Output: the
    // COMPLETED job. Side effects: transfers the job price from buyer to provider
    // through the ledger and updates settlement metrics.
    rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse) {}

    // CancelJob cancels a pending/running job. Input: job ID. Output: the
    // CANCELLED job. Side effects: returns reserved capacity to the provider. No
    // credits move.
    rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {}

    // GetBalance reads a compute-credit balance. Input: account ID. Output: the
    // balance (zero for unknown accounts). No side effects.
    rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {}

    // GetTransaction reads one committed transfer from the consensus
    // transaction history by its stable index. Input: transfer index. Output:
    // the transfer record. No side effects. The history is the ordered sequence
    // of committed transfers and is identical on every node.
    rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {}

    // ListTransactions reads committed transfers from the consensus transaction
    // history in ascending index (commit) order. Input: start index and limit.
    // Output: the transfers and the total count. No side effects. Because it
    // reads the committed block chain, two nodes return the identical sequence.
    rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {}

    // SubmitSignedTransfer orders and settles a client-signed ed25519 transfer
    // through consensus. Input: sender public key, recipient, amount, nonce,
    // prev_hash (unused for linkage), signature, and advisory timestamp. Output:
    // the settled transfer plus its committed/applied outcome. Side effects: the
    // signed transfer is submitted into consensus, ordered into a committed
    // block by a quorum, and applied deterministically by every node to the
    // shared ledger (subject to the protocol fee like every committed transfer).
    // Rejects invalid signatures, an empty recipient, and self-transfers without
    // mutating state; a transfer that commits but is unaffordable at apply time
    // returns FailedPrecondition; a settlement that cannot be confirmed in time
    // returns DeadlineExceeded.
    rpc SubmitSignedTransfer(SubmitSignedTransferRequest) returns (SubmitSignedTransferResponse) {}

    // FundAccount moves native MATRIX from the genesis-allocated reward pool to
    // an account. Input: recipient account ID and amount (> 0). Output: the
    // account and its new balance. Side effects: transfers reward-pool MATRIX to
    // the account through the treasury (conserving supply; no minting). Rejects
    // requests that exceed the reward-pool balance or the native supply cap with
    // FailedPrecondition, and is gated behind the same auth as other
    // state-mutating RPCs.
    rpc FundAccount(FundAccountRequest) returns (FundAccountResponse) {}

    // GetBridgeReadiness returns a fresh challenge-response proof that this
    // node has both a configured bridge and a live secp256k1 attestor key bound
    // to the reported chain and WrappedMatrix contract. The proof also signs
    // the protocol minimum lock amount. Input: exactly 32 random challenge
    // bytes. Output: the deployment fields, echoed challenge, and one 65-byte
    // r||s||v signature over the readiness-only domain-separated digest. No
    // side effects beyond signing; classified as a rate-limited public read
    // when connect.public_reads is enabled. Returns FailedPrecondition without
    // both bridge and key, and InvalidArgument for a malformed challenge.
    rpc GetBridgeReadiness(GetBridgeReadinessRequest) returns (GetBridgeReadinessResponse) {}

    // GetBridgeReconciliation returns the lock-and-mint bridge backing snapshot:
    // the native MATRIX locked/unlocked/outstanding in escrow, the escrow
    // balance, the equivalent wrapped ERC-20 supply, and the committed block
    // height the snapshot reflects. Input: none. Output: the reconciliation
    // report. No side effects; it is a read of the node's own escrow accounting
    // at a stated height, so it is reproducible from public data rather than a
    // manual query. Returns FailedPrecondition when the node has no bridge
    // configured (bridge.contract unset), and Internal when the on-ledger escrow
    // balance disagrees with the (locked - unlocked) accounting, which signals a
    // backing-invariant violation. Gated behind the same auth as other surfaces.
    rpc GetBridgeReconciliation(GetBridgeReconciliationRequest) returns (GetBridgeReconciliationResponse) {}

    // GetLockAttestation returns this node's signature authorizing the wrapped
    // mint for a committed lock.
    //
    // It is the half of the bridge that had no network surface at all: locking
    // is now a consensus-ordered transaction, but nothing could sign the mint
    // authorization, so no wMATRIX could come into existence. Returns
    // FailedPrecondition when the node has no bridge or no attestor key
    // configured, and NotFound when the lock id names no committed lock.
    rpc GetLockAttestation(GetLockAttestationRequest) returns (GetLockAttestationResponse) {}
}
